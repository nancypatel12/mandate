[project]
name = "mandate"
version = "0.1.0"
description = "Spending mandates for AI agents: a deterministic fence in front of PayPal."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "openai==3.46.0",
    "pydantic==2.14.3",
    "pyjwt==2.15.1",
    "python-ulid==4.1.0",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[project.scripts]
mandate = "mandate.cli:main"
mandate-agent = "agent.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

# Packages live under services/ and import as `mandate` and `agent`.
[tool.hatch.build.targets.wheel]
packages = ["services/mandate", "services/agent"]

[tool.hatch.build.targets.wheel.sources]
"services/mandate" = "mandate"
"services/agent" = "agent"

[tool.hatch.build]
dev-mode-dirs = ["services"]

[tool.pytest.ini_options]
testpaths = ["services/mandate/tests", "services/agent/tests"]
addopts = "--cov=mandate --cov=agent --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
